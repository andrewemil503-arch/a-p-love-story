    for (let i = 0; i < 10; i++) {
      const shade = 0.5 + Math.random() * 0.06;
      ctx.fillStyle = i % 2 === 0 ? `rgba(66,22,35,${shade})` : `rgba(56,18,27,${shade})`;
      ctx.fillRect(0, i * plankH, w, plankH);
      ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, i * plankH); ctx.lineTo(w, i * plankH); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(217,189,140,0.1)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(1, 1, w - 2, h - 2);
  }, 1024, 1024);
}
function mkSparkleTexture() {
  return mkCanvasTexture((ctx, w, h) => {
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,238,205,0.85)');
    g.addColorStop(1, 'rgba(255,238,205,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }, 64, 64);
}
function mkVinylTexture() {
  return mkCanvasTexture((ctx, w, h) => {
    const cx = w / 2, cy = h / 2, r = w / 2;
    const base = ctx.createRadialGradient(cx, cy, r * 0.1, cx, cy, r);
    base.addColorStop(0, '#231015'); base.addColorStop(1, '#120709');
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 34; i++) {
      ctx.strokeStyle = 'rgba(176,141,87,0.12)'; ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.arc(cx, cy, r * (0.3 + i * 0.019), 0, Math.PI * 2); ctx.stroke();
    }
    const label = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.3);
    label.addColorStop(0, '#D9BD8C'); label.addColorStop(1, '#B08D57');
    ctx.fillStyle = label;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#17090d';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.035, 0, Math.PI * 2); ctx.fill();
  }, 512, 512);
}
function mkIconTexture(kind) {
  return mkCanvasTexture((ctx, w, h) => {
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#F3DEE1'); bg.addColorStop(1, '#EFD3D6');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(107,30,44,0.3)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, w - 2, h - 2);
    ctx.fillStyle = 'rgba(107,30,44,0.55)';
    ctx.font = '84px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(kind === 'video' ? '\u25B6' : '\u2665', w / 2, h / 2 + 6);
  }, 320, 400);
}
function mkPlaqueTexture(lines, w, h) {
  w = w || 512; h = h || 220;
  const scale = 2;
  return mkCanvasTexture((ctx) => {
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FFFBF3'; ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    const lh = h / (lines.length + 1);
    lines.forEach((ln, i) => {
      ctx.font = ln.font || '600 32px Georgia, serif';
      ctx.fillStyle = ln.color || '#6B1E2C';
      ctx.fillText(ln.text, w / 2, lh * (i + 1) + 6);
    });
    ctx.strokeStyle = 'rgba(176,141,87,0.55)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(w * 0.28, h - 10); ctx.lineTo(w * 0.72, h - 10); ctx.stroke();
  }, w * scale, h * scale);
}
function heartShape(s) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0, -0.55 * s, -s, -0.55 * s, -s, 0.02 * s);
  shape.bezierCurveTo(-s, 0.5 * s, -0.3 * s, 0.85 * s, 0, 1.2 * s);
  shape.bezierCurveTo(0.3 * s, 0.85 * s, s, 0.5 * s, s, 0.02 * s);
  shape.bezierCurveTo(s, -0.55 * s, 0, -0.55 * s, 0, 0);
  return shape;
}
function mkHeartMesh(size, color, emissiveColor, emissiveIntensity) {
  const geo = new THREE.ExtrudeGeometry(heartShape(size), { depth: size * 0.35, bevelEnabled: true, bevelThickness: size * 0.06, bevelSize: size * 0.06, bevelSegments: 2, curveSegments: 10 });
  geo.center();
  const mat = new THREE.MeshStandardMaterial({ color: color, emissive: emissiveColor, emissiveIntensity: emissiveIntensity != null ? emissiveIntensity : 0.5, roughness: 0.35, metalness: 0.25 });
  return new THREE.Mesh(geo, mat);
}

function initMuseumScene() {
  if (MUSEUM.initialized) return;
  const canvas = document.getElementById('museum-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  MUSEUM.renderer = renderer;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0d12);
  scene.fog = new THREE.FogExp2(0x1a0d12, 0.045);
  MUSEUM.scene = scene;

  const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 100);
  MUSEUM.camera = camera;

  const ambient = new THREE.AmbientLight(0xffe9c9, 0.55);
  scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0xffe9c7, 0x2a1016, 0.4);
  scene.add(hemi);

  const chandelier = new THREE.PointLight(0xffd9a0, 1.3, 26, 2);
  chandelier.position.set(0, 5.2, 0);
  chandelier.castShadow = true;
  chandelier.shadow.mapSize.set(1024, 1024);
  chandelier.shadow.camera.near = 0.5;
  chandelier.shadow.camera.far = 20;
  chandelier.shadow.bias = -0.003;
  scene.add(chandelier);

  const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x3a2c1e, roughness: 0.4, metalness: 0.7 });
  const bulbMat = new THREE.MeshStandardMaterial({ color: 0xffe9c0, emissive: 0xffcf8a, emissiveIntensity: 1.6, roughness: 0.3 });
  const fixture = new THREE.Group();
  fixture.position.copy(chandelier.position);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.5, 8), fixtureMat);
  stem.position.y = 0.3;
  fixture.add(stem);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.03, 8, 24), fixtureMat);
  ring.rotation.x = Math.PI / 2;
  fixture.add(ring);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), bulbMat);
    bulb.position.set(Math.cos(a) * 0.35, -0.08, Math.sin(a) * 0.35);
    fixture.add(bulb);
  }
  scene.add(fixture);

  MUSEUM.exhibitGroup = new THREE.Group();
  scene.add(MUSEUM.exhibitGroup);

  MUSEUM.roomGroup = new THREE.Group();
  scene.add(MUSEUM.roomGroup);

  MUSEUM.fillLights = [];
  MUSEUM.chandelier = chandelier;

  // player: a small glowing heart that floats and leads the way
  const player = new THREE.Group();
  player.position.set(0, 0, 2);
  const heart = mkHeartMesh(0.26, 0x8B2942, 0xD9BD8C, 0.7);
  heart.position.y = 1.25;
  heart.rotation.x = Math.PI;
  heart.castShadow = true;
  player.add(heart);
  MUSEUM.playerHeart = heart;
  const playerLight = new THREE.PointLight(0xffcf99, 1.1, 7, 2);
  playerLight.position.y = 1.25;
  player.add(playerLight);
  const haloTex = mkSparkleTexture();
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: 0xd9bd8c, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.8 }));
  halo.scale.set(1.1, 1.1, 1);
  halo.position.y = 1.25;
  player.add(halo);
  scene.add(player);
  MUSEUM.player = player;

  // ambient drifting sparkles
  const SPARKLE_COUNT = 140;
  const positions = new Float32Array(SPARKLE_COUNT * 3);
  MUSEUM.sparkleData = [];
  for (let i = 0; i < SPARKLE_COUNT; i++) {
    const x = (Math.random() - 0.5) * 30, y = 0.3 + Math.random() * 4.2, z = (Math.random() - 0.5) * 30;
    positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
    MUSEUM.sparkleData.push({ baseY: y, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.5 });
  }
  const sparkleGeo = new THREE.BufferGeometry();
  sparkleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const sparkleMat = new THREE.PointsMaterial({ map: mkSparkleTexture(), size: 0.14, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xd9bd8c });
  MUSEUM.sparklePoints = new THREE.Points(sparkleGeo, sparkleMat);
  scene.add(MUSEUM.sparklePoints);

  MUSEUM.clock = new THREE.Clock();
  MUSEUM.initialized = true;

  bindMuseumInput();
  window.addEventListener('resize', resizeMuseumRenderer);
}

function buildMuseumRoom(roomWidth, roomDepth) {
  const roomHeight = 6.4;
  if (MUSEUM.roomGroup) { scene_disposeGroup(MUSEUM.roomGroup); MUSEUM.scene.remove(MUSEUM.roomGroup); }
  MUSEUM.roomGroup = new THREE.Group();
  MUSEUM.scene.add(MUSEUM.roomGroup);
  const halfW = roomWidth / 2, halfD = roomDepth / 2;

  const floorTex = mkFloorTexture();
  floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(roomWidth / 4, roomDepth / 4);
  const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.5, metalness: 0.1 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  MUSEUM.roomGroup.add(floor);

  const ceilMat = new THREE.MeshStandardMaterial({ color: 0xf2e7d4, roughness: 0.95 });
  const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), ceilMat);
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = roomHeight;
  ceiling.receiveShadow = true;
  MUSEUM.roomGroup.add(ceiling);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x4A1420, roughness: 0.85 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0xB08D57, emissive: 0x4a371e, emissiveIntensity: 0.15, roughness: 0.4, metalness: 0.55 });
  function wall(w, h, x, z, rotY) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    m.position.set(x, h / 2, z);
    m.rotation.y = rotY;
    m.receiveShadow = true;
    MUSEUM.roomGroup.add(m);
    const trim = new THREE.Mesh(new THREE.BoxGeometry(w, 0.22, 0.12), trimMat);
    trim.position.set(x, h - 0.15, z);
    trim.rotation.y = rotY;
    MUSEUM.roomGroup.add(trim);
  }
  wall(roomWidth, roomHeight, 0, -halfD, 0);
  wall(roomWidth, roomHeight, 0, halfD, Math.PI);
  wall(roomDepth, roomHeight, -halfW, 0, Math.PI / 2);
  wall(roomDepth, roomHeight, halfW, 0, -Math.PI / 2);

  // soft ceiling fill lights
  MUSEUM.fillLights.forEach((l) => MUSEUM.scene.remove(l));
  MUSEUM.fillLights = [];
  const fillCount = Math.max(2, Math.round((roomWidth + roomDepth) / 10));
  for (let i = 0; i < fillCount; i++) {
    const t = (i + 1) / (fillCount + 1);
    const fx = (t - 0.5) * roomWidth * 0.7;
    const l = new THREE.PointLight(0xffcf99, 0.55, roomWidth * 0.6, 2);
    l.position.set(fx, roomHeight - 0.6, (i % 2 === 0 ? -1 : 1) * halfD * 0.45);
    MUSEUM.scene.add(l);
    MUSEUM.fillLights.push(l);
  }
  MUSEUM.chandelier.distance = Math.max(roomWidth, roomDepth) * 1.4;

  MUSEUM.bounds = { minX: -halfW + 0.9, maxX: halfW - 0.9, minZ: -halfD + 0.9, maxZ: halfD - 0.9 };
}

function scene_disposeGroup(group) {
  group.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

function loadTextureSafe(url, onDone) {
  if (!url) { onDone(null); return; }
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  loader.load(url, (tex) => { tex.encoding = THREE.sRGBEncoding; onDone(tex); }, undefined, () => onDone(null));
}

function addMemoryFrame(group, x, z, facing) {
  const frame = new THREE.Group();
  frame.position.set(x, 1.7, z);
  frame.rotation.y = facing;

  const borderMat = new THREE.MeshStandardMaterial({ color: 0xB08D57, emissive: 0x3a2c16, emissiveIntensity: 0.12, roughness: 0.45, metalness: 0.45 });
  const border = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.9, 0.08), borderMat);
  frame.add(border);

  const photoMat = new THREE.MeshBasicMaterial({ color: 0xEFD3D6, toneMapped: false });
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(1.28, 1.62), photoMat);
  photo.position.z = 0.055;
  frame.add(photo);

  if (group.thumb) {
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.encoding = THREE.sRGBEncoding;
      tex.needsUpdate = true;
      photoMat.map = tex; photoMat.color.set(0xffffff); photoMat.needsUpdate = true;
    };
    img.src = group.thumb;
  } else {
    photoMat.map = mkIconTexture(group.mediaCount ? 'video' : 'photo');
    photoMat.color.set(0xffffff); photoMat.needsUpdate = true;
  }

  const plaqueTex = mkPlaqueTexture([{ text: formatDate(group.date), font: '600 34px Georgia, serif' }], 420, 110);
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.17), new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.6 }));
  plaque.position.set(0, -1.08, 0.05);
  frame.add(plaque);

  border.castShadow = true;
  MUSEUM.exhibitGroup.add(frame);

  const dir = new THREE.Vector3(Math.sin(facing), 0, Math.cos(facing));
  const point = new THREE.Vector3(x, 0, z).addScaledVector(dir, 1.1);
  MUSEUM.exhibits.push({ type: 'memory', id: group.id, label: 'View this memory', point, radius: 2.2, mesh: frame });
}

function addSongPedestal(song, x, z, facing) {
  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  grp.rotation.y = facing;

  const pedestalMat = new THREE.MeshStandardMaterial({ color: 0xFFFBF3, roughness: 0.3, metalness: 0.08 });
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.58, 1.1, 24), pedestalMat);
  pedestal.position.y = 0.55;
  pedestal.castShadow = true; pedestal.receiveShadow = true;
  grp.add(pedestal);

  const vinylTex = mkVinylTexture();
  const vinylSideMat = new THREE.MeshStandardMaterial({ color: 0x17090d, roughness: 0.4 });
  const vinylTopMat = new THREE.MeshStandardMaterial({ map: vinylTex, roughness: 0.35, metalness: 0.2 });
  const vinyl = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.055, 32), [vinylSideMat, vinylTopMat, vinylTopMat]);
  vinyl.position.y = 1.13;
  vinyl.castShadow = true;
  grp.add(vinyl);

  if (song.art) {
    loadTextureSafe(song.art, (tex) => {
      if (!tex) return;
      const artMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4 });
      const artDisc = new THREE.Mesh(new THREE.CircleGeometry(0.16, 24), artMat);
      artDisc.rotation.x = -Math.PI / 2;
      artDisc.position.y = 1.16;
      grp.add(artDisc);
    });
  }

  const plaqueTex = mkPlaqueTexture([
    { text: truncate(song.title, 20), font: 'italic 600 30px Georgia, serif' },
    { text: truncate(song.artist || '', 24), font: '22px Georgia, serif', color: '#8a7480' }
  ], 460, 160);
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.25), new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.6 }));
  plaque.position.set(0, 1.42, 0.52);
  plaque.rotation.x = -0.35;
  grp.add(plaque);

  MUSEUM.exhibitGroup.add(grp);
  MUSEUM.exhibits.push({ type: 'song', id: song.id, label: 'Play \u2014 ' + truncate(song.title, 22), point: new THREE.Vector3(x, 0, z), radius: 1.9, mesh: grp, vinyl });
}

function addDatePedestal(sd, x, z, facing) {
  const grp = new THREE.Group();
  grp.position.set(x, 0, z);
  grp.rotation.y = facing;

  const pedestalMat = new THREE.MeshStandardMaterial({ color: 0xFFFBF3, roughness: 0.3, metalness: 0.08 });
  const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.85, 20), pedestalMat);
  pedestal.position.y = 0.425;
  pedestal.castShadow = true; pedestal.receiveShadow = true;
  grp.add(pedestal);

  const heart = mkHeartMesh(0.2, 0xB08D57, 0xD9BD8C, 0.6);
  heart.position.y = 1.15;
  heart.rotation.x = Math.PI;
  heart.castShadow = true;
  grp.add(heart);

  const info = daysUntilNext(sd.date);
  const countLine = info ? (info.days === 0 ? 'Today!' : `${info.days} day${info.days !== 1 ? 's' : ''} to go`) : '';
  const plaqueTex = mkPlaqueTexture([
    { text: truncate(sd.label, 20), font: '600 32px Georgia, serif' },
    { text: formatDate(sd.date) + (countLine ? '  \u00b7  ' + countLine : ''), font: '22px Georgia, serif', color: '#8a7480' }
  ], 460, 160);
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.23), new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.6 }));
  plaque.position.set(0, 1.0, 0.44);
  plaque.rotation.x = -0.3;
  grp.add(plaque);

  MUSEUM.exhibitGroup.add(grp);
  MUSEUM.exhibits.push({ type: 'date', id: sd.id, label: 'View \u2014 ' + truncate(sd.label, 22), point: new THREE.Vector3(x, 0, z), radius: 1.9, mesh: grp, heart });
}

function buildMuseumExhibits() {
  if (MUSEUM.exhibitGroup) scene_disposeGroup(MUSEUM.exhibitGroup);
  if (MUSEUM.exhibitGroup) MUSEUM.scene.remove(MUSEUM.exhibitGroup);
  MUSEUM.exhibitGroup = new THREE.Group();
  MUSEUM.scene.add(MUSEUM.exhibitGroup);
  MUSEUM.exhibits = [];

  const memories = state.groups.slice();
  const songs = state.songs.slice();
  const dates = state.specialDates.slice();

  const memSpacing = 2.5;
  const itemsPerWall = Math.max(1, Math.ceil(memories.length / 2)) ;
  const neededWidth = memories.length ? itemsPerWall * memSpacing + 6 : 0;
  const roomWidth = Math.max(14, neededWidth);

  const pedSpacing = 2.6;
  const neededDepthSongs = songs.length ? songs.length * pedSpacing + 6 : 0;
  const neededDepthDates = dates.length ? dates.length * pedSpacing + 6 : 0;
  const roomDepth = Math.max(14, neededDepthSongs, neededDepthDates);

  buildMuseumRoom(roomWidth, roomDepth);
  const halfW = roomWidth / 2, halfD = roomDepth / 2;

  function linspace(count, spacing) {
    const arr = [];
    const start = -((count - 1) / 2) * spacing;
    for (let i = 0; i < count; i++) arr.push(start + i * spacing);
    return arr;
  }

  if (memories.length) {
    const north = memories.slice(0, itemsPerWall);
    const south = memories.slice(itemsPerWall);
    const nx = linspace(north.length, memSpacing);
    north.forEach((g, i) => addMemoryFrame(g, nx[i], -halfD + 0.1, 0));
    if (south.length) {
      const sx = linspace(south.length, memSpacing);
      south.forEach((g, i) => addMemoryFrame(g, sx[i], halfD - 0.1, Math.PI));
    }
  }
  if (songs.length) {
    const sz = linspace(songs.length, pedSpacing);
    songs.forEach((s, i) => addSongPedestal(s, -halfW + 1.3, sz[i], Math.PI / 2));
  }
  if (dates.length) {
    const dz = linspace(dates.length, pedSpacing);
    dates.forEach((sd, i) => addDatePedestal(sd, halfW - 1.3, dz[i], -Math.PI / 2));
  }

  if (!memories.length && !songs.length && !dates.length) {
    const plaqueTex = mkPlaqueTexture([
      { text: 'The gallery is still empty', font: '600 32px Georgia, serif' },
      { text: 'Add your first memory to begin', font: '22px Georgia, serif', color: '#8a7480' }
    ], 520, 180);
    const plaque = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.56), new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: 0.6 }));
    plaque.position.set(0, 1.6, -halfD + 0.3);
    MUSEUM.exhibitGroup.add(plaque);
  }
}

function resizeMuseumRenderer() {
  if (!MUSEUM.renderer) return;
  const overlay = document.getElementById('museum-overlay');
  const w = overlay.clientWidth || window.innerWidth;
  const h = overlay.clientHeight || window.innerHeight;
  MUSEUM.camera.aspect = w / h;
  MUSEUM.camera.updateProjectionMatrix();
  MUSEUM.renderer.setSize(w, h, true);
}

/* ---- input ---- */
function bindMuseumInput() {
  window.addEventListener('keydown', (e) => {
    if (!document.getElementById('museum-overlay').classList.contains('show')) return;
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
      MUSEUM.keys[k] = true;
      e.preventDefault();
    }
    if (k === 'e' && MUSEUM.focused) viewFocusedExhibit();
    if (k === 'escape') { if (MUSEUM.detailOpen) closeMuseumDetail(); else exitMuseum(); }
  });
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    MUSEUM.keys[k] = false;
  });

  const joy = document.getElementById('museum-joystick');
  const knob = document.getElementById('museum-joystick-knob');
  const JOY_R = 34;
  function joyMove(clientX, clientY) {
    const rect = joy.getBoundingClientRect();
    let dx = clientX - (rect.left + rect.width / 2);
    let dy = clientY - (rect.top + rect.height / 2);
    const dist = Math.min(JOY_R, Math.hypot(dx, dy));
    const ang = Math.atan2(dy, dx);
    dx = Math.cos(ang) * dist; dy = Math.sin(ang) * dist;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    MUSEUM.joy.x = dx / JOY_R; MUSEUM.joy.y = dy / JOY_R;
  }
  joy.addEventListener('pointerdown', (e) => {
    MUSEUM.joyPointerId = e.pointerId;
    joy.setPointerCapture(e.pointerId);
    joyMove(e.clientX, e.clientY);
  });

  scene.add(chandelier);
  const fixture = lxChandelier(); fixture.position.set(0, 5.5, 0); scene.add(fixture);
  MUSEUM.fixture = fixture;
  MUSEUM.exhibitGroup = new THREE.Group(); scene.add(MUSEUM.exhibitGroup);
  MUSEUM.roomGroup = new THREE.Group(); scene.add(MUSEUM.roomGroup);
  MUSEUM.fillLights = []; MUSEUM.chandelier = chandelier;

  const player = new THREE.Group(); player.position.set(0, 0, 2);
  const heart = mkHeartMesh(0.26, 0x9A2F4B, 0xE6C98F, 0.7);
  heart.position.y = 1.25; heart.rotation.x = Math.PI; heart.castShadow = true; player.add(heart);
  MUSEUM.playerHeart = heart;
  const pl = new THREE.PointLight(0xffcf99, 1.1, 7, 2); pl.position.y = 1.25; player.add(pl);
  player.add(lxSprite(0, 1.25, 0, 1.2, 0xe6c98f, .75));
  scene.add(player); MUSEUM.player = player;

  const N = 110, positions = new Float32Array(N * 3);
  MUSEUM.sparkleData = [];
  for (let i = 0; i < N; i++) {
    const x = (Math.random() - .5) * 30, y = .3 + Math.random() * 5, z = (Math.random() - .5) * 30;
    positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
    MUSEUM.sparkleData.push({ baseY: y, phase: Math.random() * 6.28, speed: .35 + Math.random() * .45 });
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  MUSEUM.sparklePoints = new THREE.Points(geo, new THREE.PointsMaterial({ map: mkSparkleTexture(), size: .1, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xe6c98f }));
  scene.add(MUSEUM.sparklePoints);
  MUSEUM.clock = new THREE.Clock();
  MUSEUM.initialized = true;
  bindMuseumInput();
  window.addEventListener('resize', resizeMuseumRenderer);
  window.addEventListener('orientationchange', () => setTimeout(resizeMuseumRenderer, 250));
}

function buildMuseumRoom(roomWidth, roomDepth) {
  const H = LX_H;
  if (MUSEUM.roomGroup) { scene_disposeGroup(MUSEUM.roomGroup); MUSEUM.scene.remove(MUSEUM.roomGroup); }
  const R = MUSEUM.roomGroup = new THREE.Group(); MUSEUM.scene.add(R);
  const halfW = roomWidth / 2, halfD = roomDepth / 2;
  const goldM = new THREE.MeshStandardMaterial({ color: 0xC9A566, metalness: .8, roughness: .32, emissive: 0x3a2a10, emissiveIntensity: .18 });
  const creamM = new THREE.MeshStandardMaterial({ color: 0xF0E5D2, roughness: .6 });

  const ft = mkFloorTexture(); ft.wrapS = ft.wrapT = THREE.RepeatWrapping; ft.repeat.set(roomWidth / 5.6, roomDepth / 5.6);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), new THREE.MeshStandardMaterial({ map: ft, roughness: .26, metalness: .12 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; R.add(floor);
  const med = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 5.4), new THREE.MeshStandardMaterial({ map: lxMedallionTex(), transparent: true, roughness: .3, metalness: .1, polygonOffset: true, polygonOffsetFactor: -2 }));
  med.rotation.x = -Math.PI / 2; med.position.y = .012; med.receiveShadow = true; R.add(med);

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), new THREE.MeshStandardMaterial({ color: 0xEADCC5, roughness: .9 }));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = H; R.add(ceil);
  const nx = Math.max(2, Math.round(roomWidth / 3.6)), nz = Math.max(2, Math.round(roomDepth / 3.6));
  for (let i = 1; i < nx; i++) { const b = new THREE.Mesh(new THREE.BoxGeometry(.14, .16, roomDepth), goldM); b.position.set(-halfW + i * roomWidth / nx, H - .08, 0); R.add(b); }
  for (let j = 1; j < nz; j++) { const b = new THREE.Mesh(new THREE.BoxGeometry(roomWidth, .16, .14), goldM); b.position.set(0, H - .08, -halfD + j * roomDepth / nz); R.add(b); }
  const rose = new THREE.Mesh(new THREE.TorusGeometry(1.5, .07, 8, 48), goldM); rose.rotation.x = Math.PI / 2; rose.position.y = H - .05; R.add(rose);

  const wt = lxWallTex(); wt.wrapS = wt.wrapT = THREE.RepeatWrapping;
  const wn = lxWainTex(); wn.wrapS = wn.wrapT = THREE.RepeatWrapping;
  function wall(w, x, z, rotY) {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; R.add(g);
    const t = wt.clone(); t.needsUpdate = true; t.repeat.set(w / 2.4, H / 2.4);
    const p = new THREE.Mesh(new THREE.PlaneGeometry(w, H), new THREE.MeshStandardMaterial({ map: t, roughness: .85 })); p.position.y = H / 2; p.receiveShadow = true; g.add(p);
    const n = wn.clone(); n.needsUpdate = true; n.repeat.set(w / 1.7, 1);
    const wain = new THREE.Mesh(new THREE.BoxGeometry(w, 1.15, .08), new THREE.MeshStandardMaterial({ map: n, roughness: .6 })); wain.position.set(0, .575, .04); g.add(wain);
    [[w, .1, .13, 1.2, .06, goldM], [w, .24, .14, .12, .07, goldM], [w, .3, .22, H - .15, .11, creamM], [w, .08, .27, H - .34, .13, goldM]].forEach(([bw, bh, bd, y, z, m]) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), m); b.position.set(0, y, z); g.add(b);
    });
  }
  wall(roomWidth, 0, -halfD, 0); wall(roomWidth, 0, halfD, Math.PI);
  wall(roomDepth, -halfW, 0, Math.PI / 2); wall(roomDepth, halfW, 0, -Math.PI / 2);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const x = sx * (halfW - .3), z = sz * (halfD - .3);
    const col = new THREE.Mesh(new THREE.CylinderGeometry(.24, .26, H, 24), creamM); col.position.set(x, H / 2, z); R.add(col);
    [.14, H - .14].forEach((y) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .28, 24), goldM); c.position.set(x, y, z); R.add(c); });
  });

  MUSEUM.fillLights.forEach((l) => MUSEUM.scene.remove(l)); MUSEUM.fillLights = [];
  const fc = Math.max(2, Math.round((roomWidth + roomDepth) / 10));
  for (let i = 0; i < fc; i++) {
    const t = (i + 1) / (fc + 1);
    const l = new THREE.PointLight(0xffcf99, .6, roomWidth * .6, 2);
    l.position.set((t - .5) * roomWidth * .7, H - .9, (i % 2 === 0 ? -1 : 1) * halfD * .45);
    MUSEUM.scene.add(l); MUSEUM.fillLights.push(l);
  }
  MUSEUM.chandelier.distance = Math.max(roomWidth, roomDepth) * 1.5;
  MUSEUM.bounds = { minX: -halfW + 1, maxX: halfW - 1, minZ: -halfD + 1, maxZ: halfD - 1 };
  MUSEUM.roomHalf = { w: halfW, d: halfD };
}

function lxUpgradePhoto(group, photoMat, token, delay) {
  setTimeout(() => {
    if (MUSEUM.buildToken !== token) return;
    storageGet('group-media-' + group.id).then((raw) => {
      let items = []; try { items = raw ? JSON.parse(raw) : []; } catch (e) {}
      const it = items.find((i) => i && i.type === 'image' && i.url);
      if (!it || MUSEUM.buildToken !== token) return;
      const url = it.url.indexOf('/upload/') > -1 ? it.url.replace('/upload/', '/upload/w_900,c_limit,q_auto/') : it.url;
      loadTextureSafe(url, (tex) => {
        if (!tex || MUSEUM.buildToken !== token) return;
        lxFitCover(tex, tex.image.width, tex.image.height, 1.14, 1.5);
        photoMat.userData.hi = true; photoMat.map = tex; photoMat.color.set(0xffffff); photoMat.needsUpdate = true;
      });
    }).catch(() => {});
  }, delay);
}

function addMemoryFrame(group, x, z, facing) {
  const frame = new THREE.Group();
  frame.position.set(x, 2.45, z); frame.rotation.y = facing;
  const goldM = new THREE.MeshStandardMaterial({ color: 0xC9A566, metalness: .8, roughness: .3, emissive: 0x3a2a10, emissiveIntensity: .2 });
  const deepM = new THREE.MeshStandardMaterial({ color: 0x8E6B35, metalness: .7, roughness: .4 });
  const outer = new THREE.Mesh(new THREE.BoxGeometry(1.64, 2.04, .1), goldM); outer.castShadow = true; frame.add(outer);
  frame.add(new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.9, .14), deepM));
  const matte = new THREE.Mesh(new THREE.PlaneGeometry(1.36, 1.76), new THREE.MeshStandardMaterial({ color: 0xF5EDDF, roughness: .9 })); matte.position.z = .075; frame.add(matte);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.56, .04), goldM); lip.position.z = .075; frame.add(lip);
  const photoMat = new THREE.MeshBasicMaterial({ color: 0xEFD3D6, toneMapped: false });
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(1.14, 1.5), photoMat); photo.position.z = .1; frame.add(photo);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => { const s = new THREE.Mesh(new THREE.SphereGeometry(.065, 12, 10), goldM); s.position.set(sx * .82, sy * 1.02, .06); frame.add(s); });

  if (group.thumb) {
    const img = new Image();
    img.onload = () => { const tex = new THREE.Texture(img); tex.encoding = THREE.sRGBEncoding; lxFitCover(tex, img.width, img.height, 1.14, 1.5); tex.needsUpdate = true; if (!photoMat.userData.hi) { photoMat.map = tex; photoMat.color.set(0xffffff); photoMat.needsUpdate = true; } };
    img.src = group.thumb;
  } else { photoMat.map = mkIconTexture(); photoMat.color.set(0xffffff); photoMat.needsUpdate = true; }
  if (MUSEUM._frameIdx < 36) lxUpgradePhoto(group, photoMat, MUSEUM.buildToken, 250 + (MUSEUM._frameIdx++) * 140);

  const memLine = group.memory ? truncate(group.memory, 34) : 'A moment we kept';
  const plaqueTex = mkPlaqueTexture([
    { text: formatDate(group.date), font: '700 54px ' + LX_SERIF },
    { text: memLine, font: 'italic 500 34px ' + LX_SERIF, color: '#4A2C12' }
  ], 600, 190);
  const backing = new THREE.Mesh(new THREE.BoxGeometry(1.08, .34, .04), goldM); backing.position.set(0, -1.4, .04); frame.add(backing);
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(1.04, .33), new THREE.MeshStandardMaterial({ map: plaqueTex, roughness: .45, metalness: .35 })); plaque.position.set(0, -1.4, .065); frame.add(plaque);

  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(.03, .03, .78, 12), goldM); lamp.rotation.z = Math.PI / 2; lamp.position.set(0, 1.2, .24); frame.add(lamp);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.04, .12, .22), goldM); arm.position.set(0, 1.12, .14); frame.add(arm);
  frame.add(lxSprite(0, 1.12, .3, 1.7, 0xffe3b0, .45));

  MUSEUM.exhibitGroup.add(frame);
  const dir = new THREE.Vector3(Math.sin(facing), 0, Math.cos(facing));
  const point = new THREE.Vector3(x, 0, z).addScaledVector(dir, 1.1);
  MUSEUM.exhibits.push({ type: 'memory', id: group.id, label: 'View \u00b7 ' + formatDate(group.date), point, radius: 2.3, mesh: frame });
}

function lxPedestalBase(grp, h, rTop, rBot) {
  const marble = new THREE.MeshStandardMaterial({ color: 0xF4EBDD, roughness: .22, metalness: .05 });
  const goldM = new THREE.MeshStandardMaterial({ color: 0xC9A566, metalness: .8, roughness: .3, emissive: 0x3a2a10, emissiveIntensity: .18 });
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(rBot + .14, rBot + .18, .14, 32), goldM); plinth.position.y = .07; grp.add(plinth);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, 32), marble); shaft.position.y = .14 + h / 2; shaft.castShadow = true; shaft.receiveShadow = true; grp.add(shaft);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(rTop + .1, rTop, .1, 32), goldM); cap.position.y = .14 + h + .05; grp.add(cap);
  lxPool(grp, 3);
  return .14 + h + .1;
}

function addSongPedestal(song, x, z, facing) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = facing;
  const top = lxPedestalBase(grp, .92, .46, .5);
  const vinylTex = mkVinylTexture();
  const side = new THREE.MeshStandardMaterial({ color: 0x17090d, roughness: .4 });
  const topM = new THREE.MeshStandardMaterial({ map: vinylTex, roughness: .35, metalness: .2 });
  const vinyl = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, .055, 40), [side, topM, topM]);
  vinyl.position.y = top + .05; vinyl.castShadow = true; grp.add(vinyl);
  if (song.art) loadTextureSafe(song.art, (tex) => {
    if (!tex) return;
    const art = new THREE.Mesh(new THREE.CircleGeometry(.16, 28), new THREE.MeshStandardMaterial({ map: tex, roughness: .4 }));
    art.rotation.x = -Math.PI / 2; art.position.y = top + .082; grp.add(art);
  });
  const tex = mkPlaqueTexture([
    { text: truncate(song.title, 26), font: 'italic 700 46px ' + LX_SERIF },
    { text: truncate(song.artist || 'Our song', 30), font: '500 30px ' + LX_SERIF, color: '#4A2C12' }
  ], 520, 170);
  const goldM = new THREE.MeshStandardMaterial({ color: 0xC9A566, metalness: .8, roughness: .3 });
  const plate = new THREE.Group(); plate.position.set(0, .8, .56); plate.rotation.x = -.2;
  const back = new THREE.Mesh(new THREE.BoxGeometry(.86, .3, .03), goldM); plate.add(back);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(.82, .27), new THREE.MeshStandardMaterial({ map: tex, roughness: .45, metalness: .35 })); face.position.z = .02; plate.add(face);
  grp.add(plate);
  MUSEUM.exhibitGroup.add(grp);
  MUSEUM.exhibits.push({ type: 'song', id: song.id, label: 'Play \u00b7 ' + truncate(song.title, 22), point: new THREE.Vector3(x, 0, z), radius: 2, mesh: grp, vinyl });
}

function addDatePedestal(sd, x, z, facing) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = facing;
  const top = lxPedestalBase(grp, .78, .36, .42);
  const goldM = new THREE.MeshStandardMaterial({ color: 0xC9A566, metalness: .8, roughness: .3 });
  const heart = mkHeartMesh(.18, 0xC9A566, 0xE6C98F, .6); heart.position.y = top + .3; heart.rotation.x = Math.PI; heart.castShadow = true; grp.add(heart);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(.36, 28, 16, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .14, roughness: .05, metalness: .1, depthWrite: false }));
  dome.position.y = top; grp.add(dome);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.36, .02, 8, 36), goldM); ring.rotation.x = Math.PI / 2; ring.position.y = top; grp.add(ring);
  const info = daysUntilNext(sd.date);
  const cl = info ? (info.days === 0 ? 'Today!' : info.days + ' day' + (info.days !== 1 ? 's' : '') + ' to go') : '';
  const tex = mkPlaqueTexture([
    { text: truncate(sd.label, 24), font: '700 46px ' + LX_SERIF },
    { text: formatDate(sd.date) + (cl ? '  \u00b7  ' + cl : ''), font: '500 28px ' + LX_SERIF, color: '#4A2C12' }
  ], 560, 170);
  const plate = new THREE.Group(); plate.position.set(0, .62, .46); plate.rotation.x = -.2;
  plate.add(new THREE.Mesh(new THREE.BoxGeometry(.9, .3, .03), goldM));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(.86, .27), new THREE.MeshStandardMaterial({ map: tex, roughness: .45, metalness: .35 })); face.position.z = .02; plate.add(face);
  grp.add(plate);
  MUSEUM.exhibitGroup.add(grp);
  MUSEUM.exhibits.push({ type: 'date', id: sd.id, label: 'View \u00b7 ' + truncate(sd.label, 22), point: new THREE.Vector3(x, 0, z), radius: 2, mesh: grp, heart, heartBase: top + .3 });
}

function buildMuseumExhibits() {
  if (MUSEUM.exhibitGroup) { scene_disposeGroup(MUSEUM.exhibitGroup); MUSEUM.scene.remove(MUSEUM.exhibitGroup); }
  MUSEUM.exhibitGroup = new THREE.Group(); MUSEUM.scene.add(MUSEUM.exhibitGroup);
  MUSEUM.exhibits = []; MUSEUM.buildToken = (MUSEUM.buildToken || 0) + 1; MUSEUM._frameIdx = 0;
  const memories = state.groups.slice(), songs = state.songs.slice(), dates = state.specialDates.slice();
  const memSpacing = 2.9, pedSpacing = 2.8;
  const perWall = Math.max(1, Math.ceil(memories.length / 2));
  const roomWidth = Math.max(16, memories.length ? perWall * memSpacing + 6 : 0);
  const roomDepth = Math.max(16, songs.length ? songs.length * pedSpacing + 6 : 0, dates.length ? dates.length * pedSpacing + 6 : 0);
  buildMuseumRoom(roomWidth, roomDepth);
  const halfW = roomWidth / 2, halfD = roomDepth / 2;
  const lin = (c, s) => { const a = [], st = -((c - 1) / 2) * s; for (let i = 0; i < c; i++) a.push(st + i * s); return a; };
  if (memories.length) {
    const north = memories.slice(0, perWall), south = memories.slice(perWall);
    const nx = lin(north.length, memSpacing); north.forEach((g, i) => addMemoryFrame(g, nx[i], -halfD + .12, 0));
    if (south.length) { const sx = lin(south.length, memSpacing); south.forEach((g, i) => addMemoryFrame(g, sx[i], halfD - .12, Math.PI)); }
  }
  if (songs.length) { const sz = lin(songs.length, pedSpacing); songs.forEach((s, i) => addSongPedestal(s, -halfW + 1.5, sz[i], Math.PI / 2)); }
  if (dates.length) { const dz = lin(dates.length, pedSpacing); dates.forEach((sd, i) => addDatePedestal(sd, halfW - 1.5, dz[i], -Math.PI / 2)); }
  if (!memories.length && !songs.length && !dates.length) {
    const tex = mkPlaqueTexture([
      { text: 'The gallery awaits', font: '700 56px ' + LX_SERIF },
      { text: 'Add your first memory to begin our collection', font: 'italic 500 30px ' + LX_SERIF, color: '#4A2C12' }
    ], 640, 190);
    const plaque = new THREE.Mesh(new THREE.PlaneGeometry(2.2, .65), new THREE.MeshStandardMaterial({ map: tex, roughness: .45, metalness: .35 }));
    plaque.position.set(0, 2.2, -halfD + .3); MUSEUM.exhibitGroup.add(plaque);
  }
}

function updateMuseumCamera(delta) {
  const p = MUSEUM.player.position, yaw = MUSEUM.cameraYaw, pitch = MUSEUM.cameraPitch, dist = MUSEUM.cameraDist;
  const desired = new THREE.Vector3(p.x + Math.sin(yaw) * Math.cos(pitch) * dist, 1.5 + Math.sin(pitch) * dist, p.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  const b = MUSEUM.bounds;
  desired.x = Math.max(b.minX - .55, Math.min(b.maxX + .55, desired.x));
  desired.z = Math.max(b.minZ - .55, Math.min(b.maxZ + .55, desired.z));
  desired.y = Math.max(.9, Math.min(LX_H - .7, desired.y));
  const f = 1 - Math.pow(0.0008, delta);
  MUSEUM.camera.position.lerp(desired, f);
  const look = new THREE.Vector3(p.x, 1.4, p.z);
  if (!MUSEUM._lookTarget) MUSEUM._lookTarget = look.clone();
  MUSEUM._lookTarget.lerp(look, f);
  MUSEUM.camera.lookAt(MUSEUM._lookTarget);
}

function enterMuseum() {
  if (!museumSupported()) { toast('3D museum could not load \u2014 check your connection and try again', true); return; }
  const overlay = document.getElementById('museum-overlay'), loading = document.getElementById('museum-loading');
  overlay.classList.add('show'); document.documentElement.classList.add('museum-open');
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  loading.style.display = 'flex'; closeMuseumDetail(true);
  if (!MUSEUM.initialized) initMuseumScene();
  resizeMuseumRenderer();
  const loads = document.fonts && document.fonts.load ? Promise.all([
    document.fonts.load('700 40px "Cormorant Garamond"'), document.fonts.load('italic 500 30px "Cormorant Garamond"')
  ]).catch(() => {}) : Promise.resolve();
  Promise.race([loads, new Promise((r) => setTimeout(r, 1500))]).then(() => {
    if (!overlay.classList.contains('show')) return;
    buildMuseumExhibits();
    MUSEUM.player.position.set(0, 0, Math.min(MUSEUM.bounds.maxZ - 1, 2.5));
    MUSEUM.player.rotation.y = 0; MUSEUM.cameraYaw = 0; MUSEUM.cameraPitch = .32; MUSEUM._lookTarget = null;
    MUSEUM.keys = {}; MUSEUM.joy = { x: 0, y: 0 };
    requestAnimationFrame(() => requestAnimationFrame(() => { loading.style.display = 'none'; }));
    if (MUSEUM.rafId) cancelAnimationFrame(MUSEUM.rafId);
    MUSEUM.clock.getDelta(); museumLoop();
    const hint = document.getElementById('museum-hint');
    hint.style.opacity = '1'; clearTimeout(MUSEUM.hintTimer);
    MUSEUM.hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 6000);
  });
}

function museumLoop() {
  MUSEUM.rafId = requestAnimationFrame(museumLoop);
  const delta = Math.min(0.05, MUSEUM.clock.getDelta());
  updateMuseumMovement(delta); updateMuseumCamera(delta); updateMuseumFocus();
  const t = performance.now() / 1000;
  if (MUSEUM.playerHeart) { MUSEUM.playerHeart.position.y = 1.25 + Math.sin(t * 2.4) * .05; MUSEUM.playerHeart.rotation.y += delta * .8; }
  if (MUSEUM.fixture) MUSEUM.fixture.rotation.y += delta * .08;
  for (const ex of MUSEUM.exhibits) {
    if (ex.vinyl) ex.vinyl.rotation.y += delta * .9;
    if (ex.heart) { ex.heart.position.y = (ex.heartBase || 1.15) + Math.sin(t * 2 + ex.point.x) * .035; ex.heart.rotation.y += delta * .6; }
  }
  const sp = MUSEUM.sparklePoints;
  if (sp) {
    const a = sp.geometry.attributes.position;
    for (let i = 0; i < MUSEUM.sparkleData.length; i++) { const d = MUSEUM.sparkleData[i]; a.array[i * 3 + 1] = d.baseY + Math.sin(t * d.speed + d.phase) * .3; }
    a.needsUpdate = true; sp.rotation.y += delta * .02;
  }
  MUSEUM.renderer.render(MUSEUM.scene, MUSEUM.camera);
}

</script>

    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    el.addEventListener('pointerdown', () => { try { window.getSelection().removeAllRanges(); } catch (e) {} });
  });
})();
